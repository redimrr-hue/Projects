<!DOCTYPE html>
<html>
    <body>

        <h3>File Upload Progress</h3>

        <progress id="p" value="0" max="100"></progress>

        <script>
        setInterval(function () {
            if (p.value < 95) {
                p.value += 2;
            }
            if (p.value >= 95) {
                p.value += 0.2;
            }
            if (p.value >= 98) {
                p.value -= 5;
            }
        }, 100);
        </script>
    </body>
</html>
